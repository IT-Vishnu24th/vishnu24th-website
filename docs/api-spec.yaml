openapi: 3.1.0
info:
  title: Vishnu 24th Website API
  description: |
    REST API for the Vishnu 24th (Engineering Faculty Freshy Week) website.

    ## Authentication
    Most endpoints require a valid **session cookie** (`session`) obtained via `POST /api/auth/session`.
    Roles used throughout this API:
    - **admin** – full access
    - **staff** – year-2 students (68x)
    - **participant** – year-1 students (69x)

    Unauthenticated requests return `401`. Insufficient-role requests return `403`.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Auth
    description: Authentication and session management
  - name: Flags
    description: Feature flag management (admin only for mutations)
  - name: Leaderboard
    description: Group score ranking (authenticated)
  - name: Scan
    description: Club QR-code scanning (participants only)
  - name: Stage
    description: Stage performance scheduling (admin only for mutations)
  - name: Users
    description: User profile management
  - name: Phase
    description: Event phase management (admin only for mutations)
  - name: Popkaew
    description: PopKaew clicker game integration (participant only)
  - name: WasteSort
    description: Waste-sorting mini-game (participant only, gated by the `game-sustain` feature flag)
  - name: Stats
    description: Admin statistics and reports (admin only)
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HTTP-only session cookie issued by POST /api/auth/session
  schemas:
    MultiLang:
      type: object
      required:
        - en
        - th
      properties:
        en:
          type: string
          example: English text
        th:
          type: string
          example: ข้อความภาษาไทย
    Name:
      type: object
      required:
        - title
        - firstName
        - surname
        - nickname
      properties:
        title:
          type: string
          example: Mr.
        firstName:
          type: string
          example: John
        middleName:
          type: string
          nullable: true
          example: null
        surname:
          type: string
          example: Doe
        nickname:
          type: string
          example: Jack
    MultiLangName:
      type: object
      required:
        - en
        - th
      properties:
        en:
          $ref: "#/components/schemas/Name"
        th:
          $ref: "#/components/schemas/Name"
    LocationId:
      type: string
      enum:
        - en100
        - eng3
        - eng4
        - larnsom
        - larngear
        - plateau
      example: eng3
    GroupRoom:
      type: object
      required:
        - locationId
        - name
      properties:
        locationId:
          $ref: "#/components/schemas/LocationId"
        name:
          type: string
          example: ENG3 Room A
    RegistrationPoint:
      type: object
      required:
        - package
        - firstdate
        - vishnu
      properties:
        package:
          type: integer
          example: 1
        firstdate:
          $ref: "#/components/schemas/LocationId"
        vishnu:
          $ref: "#/components/schemas/LocationId"
    Group:
      type: object
      required:
        - label
        - vesselName
        - registrationPoint
        - room
      properties:
        label:
          type: string
          example: A1
        vesselName:
          $ref: "#/components/schemas/MultiLang"
        registrationPoint:
          $ref: "#/components/schemas/RegistrationPoint"
        room:
          oneOf:
            - $ref: "#/components/schemas/GroupRoom"
            - type: string
              enum: [""]
    Vessel:
      type: object
      description: Public group shape. `vesselName` is present only when the `reveal-vessel` feature flag is enabled.
      required:
        - registrationPoint
        - room
      properties:
        vesselName:
          $ref: "#/components/schemas/MultiLang"
        registrationPoint:
          $ref: "#/components/schemas/RegistrationPoint"
        room:
          oneOf:
            - $ref: "#/components/schemas/GroupRoom"
            - type: string
              enum: [""]
    User:
      type: object
      required:
        - id
        - role
        - name
        - group
        - department
        - prefLanguage
        - yarnAccepted
      properties:
        id:
          type: string
          description: Student ID
          example: "6900001121"
        role:
          type: string
          enum:
            - admin
            - staff
            - participant
          example: participant
        name:
          $ref: "#/components/schemas/MultiLangName"
        group:
          $ref: "#/components/schemas/Vessel"
        department:
          $ref: "#/components/schemas/MultiLang"
        prefLanguage:
          type: string
          enum:
            - en
            - th
          example: th
        yarnAccepted:
          type: boolean
          description: Missing on the Firestore doc is treated as false
          example: false
    FeatureFlag:
      type: object
      required:
        - id
        - name
        - enabled
      properties:
        id:
          type: string
          example: reveal-vessel
        name:
          $ref: "#/components/schemas/MultiLang"
        enabled:
          type: boolean
          example: false
    StagePerformance:
      type: object
      required:
        - id
        - name
        - description
        - status
        - duration
        - start
        - end
      properties:
        id:
          type: string
          example: stage-001
        name:
          $ref: "#/components/schemas/MultiLang"
        description:
          $ref: "#/components/schemas/MultiLang"
        status:
          type: string
          enum:
            - complete
            - live
            - upcoming
            - delayed
          example: upcoming
        duration:
          type: integer
          description: Duration in minutes
          example: 30
        start:
          type: string
          format: date-time
          example: "2026-07-04T09:00:00.000Z"
        end:
          type: string
          format: date-time
          example: "2026-07-04T09:30:00.000Z"
    WasteSortPlayer:
      type: object
      description: Public wasteSort player shape (the internal `group` label is never exposed).
      required:
        - name
        - playCount
        - vesselName
        - sustainScore
        - playsToday
        - lastPlayDate
      properties:
        name:
          type: string
          description: Player's English first name (denormalized at creation)
          example: John
        playCount:
          type: integer
          description: Lifetime rounds played
          example: 7
        vesselName:
          $ref: "#/components/schemas/MultiLang"
        sustainScore:
          type: number
          description: Lifetime accumulated score across all rounds
          example: 420
        playsToday:
          type: integer
          description: Rounds played on `lastPlayDate` (only meaningful when `lastPlayDate` is today)
          example: 2
        lastPlayDate:
          type: string
          description: Date key (YYYY-MM-DD, Asia/Bangkok) of the most recent round; empty string if never played
          example: "2026-07-13"
    UserAnswerHistoryItem:
      type: object
      required:
        - id
        - userAnswer
        - isRevealed
        - isCorrect
        - correctAnswer
      properties:
        id:
          type: string
          example: q1
        userAnswer:
          oneOf:
            - type: string
              example: "A"
            - type: array
              items:
                type: string
              example: ["A", "B"]
          nullable: true
        isRevealed:
          type: boolean
          example: true
        isCorrect:
          type: boolean
          nullable: true
          example: true
        correctAnswer:
          oneOf:
            - type: string
              example: "A"
            - type: array
              items:
                type: string
              example: ["A", "B"]
          nullable: true
    RegistrationPointResponse:
      allOf:
        - $ref: "#/components/schemas/RegistrationPoint"
        - type: object
          required:
            - room
          properties:
            room:
              oneOf:
                - $ref: "#/components/schemas/GroupRoom"
                - type: string
                  enum: [""]
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/AppErrorCode"
        message:
          type: string
          example: Error message description
    AppErrorCode:
      type: string
      description: Machine-readable error code (`src/types/appErrorCode.ts`). Frontend switches on this instead of parsing `message`.
      enum:
        - INTERNAL_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - INVALID_BODY
        - NOT_FOUND
        - CONFLICT
        - USER_NOT_FOUND
        - PLAYER_NOT_FOUND
        - GROUP_NOT_FOUND
        - CLUB_NOT_FOUND
        - ANSWER_NOT_FOUND
        - REGISTRATION_POINT_NOT_FOUND
        - FLAG_NOT_FOUND
        - STAGE_NOT_FOUND
        - MISSING_QUERY_PARAM
        - MISSING_PHASE
        - INVALID_QUESTION_ID
        - INVALID_ANSWER_FORMAT
        - ANSWER_ALREADY_SUBMITTED
        - SUBMISSION_CLOSED
        - GAME_NOT_ACTIVE
        - ALREADY_SCANNED
        - DAILY_LIMIT_REACHED
      example: INTERNAL_ERROR
    AuthErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: error-code
        message:
          type: string
          example: Detailed error message
paths:
  /api/auth/session:
    post:
      tags:
        - Auth
      operationId: createSession
      summary: Create a session cookie (sign in)
      description: |
        Verifies a Firebase ID token, validates that the email belongs to a
        recognised Chula student account (class 68 or 69 ending in 21),
        checks that the user exists in Firestore, then sets an HTTP-only
        session cookie valid for 5 days.

        Email pattern: 6[89]\d{6}21@student.chula.ac.th
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Firebase ID token from the client-side auth flow
                  example: mock-id-token
      responses:
        "200":
          description: Signed in successfully; session cookie is set
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Sign in successfully
        "400":
          description: Missing ID token or email not found in token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              examples:
                missingIdToken:
                  value:
                    error: missing-id-token
                    message: Missing ID token
                emailNotProvided:
                  value:
                    error: email-not-provided
                    message: No email found
        "401":
          description: ID token is invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: invalid-id-token
                message: Invalid ID token
        "403":
          description: Email does not match the required student pattern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: invalid-email-domain
                message: This email is not a valid student account
        "404":
          description: User does not exist in Firestore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: profile-not-found
                message: User does not exist
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: internal-server-error
                message: Sign in failed
  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Destroy session (sign out)
      description: Deletes the session cookie.
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: Logout failed
  /api/flags:
    get:
      tags:
        - Flags
      operationId: listFlags
      summary: List all feature flags
      description: Returns every feature flag. No authentication required.
      responses:
        "200":
          description: Array of feature flags
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureFlag"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
    post:
      tags:
        - Flags
      operationId: createFlag
      summary: Create a new feature flag
      description: Admin only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  minLength: 1
                  example: reveal-vessel
                name:
                  $ref: "#/components/schemas/MultiLang"
                enabled:
                  type: boolean
                  default: false
                  example: false
      responses:
        "200":
          description: Feature flag created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/FeatureFlag"
        "400":
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_BODY
                message: Invalid body
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "409":
          description: Feature flag already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: CONFLICT
                message: Conflict
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
    patch:
      tags:
        - Flags
      operationId: updateFlags
      summary: Bulk update feature flag states
      description: Admin only. Accepts a map of flagId to boolean.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
              example:
                reveal-vessel: true
                game-popkaew: false
      responses:
        "200":
          description: Flags updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
                    example: true
        "400":
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_BODY
                message: Invalid body
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "404":
          description: Flag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FLAG_NOT_FOUND
                message: Not found
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
  /api/flags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: reveal-vessel
    get:
      tags:
        - Flags
      operationId: getFlag
      summary: Get a single feature flag by ID
      description: No authentication required.
      responses:
        "200":
          description: Feature flag found
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/FeatureFlag"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FLAG_NOT_FOUND
                message: Not found
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
    put:
      tags:
        - Flags
      operationId: setFlag
      summary: Set the enabled state of a feature flag
      description: Admin only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Feature flag updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/FeatureFlag"
        "400":
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_BODY
                message: Invalid body
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FLAG_NOT_FOUND
                message: Not found
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
  /api/leaderboard:
    get:
      tags:
        - Leaderboard
      operationId: getLeaderboard
      summary: Get leaderboard data
      description: |
        Returns top-3 ranked groups and the authenticated user's group rank.
        Groups are sorted by score descending; ties broken alphabetically by label.
        Requires authentication (any role).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - top3
                      - rank
                      - score
                    properties:
                      top3:
                        type: array
                        items:
                          type: object
                          description: "`vesselName` present only when the `reveal-vessel` feature flag is enabled"
                          required:
                            - score
                            - rank
                          properties:
                            vesselName:
                              $ref: "#/components/schemas/MultiLang"
                            score:
                              type: number
                              example: 420
                            rank:
                              type: integer
                              example: 1
                      rank:
                        type: integer
                        nullable: true
                        description: Rank of the authenticated user's group (null if group not found)
                        example: 5
                      score:
                        type: number
                        nullable: true
                        description: Score of the authenticated user's group (null if group not found)
                        example: 310
                      vesselName:
                        allOf:
                          - $ref: "#/components/schemas/MultiLang"
                        description: Vessel name of the authenticated user's group; present only when the `reveal-vessel` feature flag is enabled
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
  /api/leaderboard/update:
    put:
      tags:
        - Leaderboard
      operationId: updateLeaderboard
      summary: Recalculate and update all leaderboard scores
      description: Admin only. Triggers score aggregation from groups.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Leaderboard updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
                    example: true
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
  /api/groups/commitScanBonus:
    put:
      tags:
        - Leaderboard
      operationId: commitScanBonus
      summary: Apply ranked scan-score bonuses to all groups
      description: Admin only. Ranks groups by scan score and commits the rank-based bonus to each group.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Bonuses committed; per-group results returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - group
                        - scanScore
                        - scanRank
                        - scanRankBonus
                      properties:
                        group:
                          type: string
                          example: A1
                        scanScore:
                          type: number
                          example: 350
                        scanRank:
                          type: integer
                          example: 2
                        scanRankBonus:
                          type: number
                          example: 1800
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
  /api/scan:
    post:
      tags:
        - Scan
      operationId: scanClub
      summary: Scan a club QR code
      description: |
        Participant only. Records a club visit for the authenticated user and
        awards scan score to their group.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clubId
              properties:
                clubId:
                  type: string
                  example: club-123
      responses:
        "200":
          description: Club scanned successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - createdAt
                      - code
                      - score
                    properties:
                      createdAt:
                        type: string
                        format: date-time
                        example: "2026-07-04T09:00:00.000Z"
                      code:
                        type: string
                        description: Stable club code (from the club's `code` field)
                        example: intania-badminton-club
                      score:
                        type: number
                        example: 10
        "400":
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_BODY
                message: Invalid body
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
