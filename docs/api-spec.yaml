  /api/wastesort/me/round:
    get:
      tags:
        - WasteSort
      operationId: getWasteSortRoundQuota
      summary: Check remaining wasteSort plays today
      description: >-
        Participant only. Requires the `game-sustain` feature flag (403 GAME_NOT_ACTIVE when off).
        Never 404s — a player who has never played gets the full quota. Quota resets at midnight
        Asia/Bangkok (calendar day), independent of feature-flag windows.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Today's play quota
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - playsToday
                      - maxPlaysPerDay
                      - playsRemaining
                      - canPlay
                    properties:
                      playsToday:
                        type: integer
                        example: 1
                      maxPlaysPerDay:
                        type: integer
                        example: 3
                      playsRemaining:
                        type: integer
                        example: 2
                      canPlay:
                        type: boolean
                        example: true
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions or game not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: GAME_NOT_ACTIVE
                message: Game is not active
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
    post:
      tags:
        - WasteSort
      operationId: submitWasteSortRound
      summary: Submit a finished wasteSort round
      description: >-
        Participant only. Requires the `game-sustain` feature flag (403 GAME_NOT_ACTIVE when off).
        Call once per finished round (each of the up-to-3 daily plays). Atomically: auto-creates
        the player doc on the first-ever round, enforces the daily play limit, adds the (floored
        at 0) score to the player's lifetime `sustainScore`, and rolls the same amount into the
        group's `scoreSources.sustainScore`. Score accumulates — it is never overwritten.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: number
                  description: Final score of the round (negative values are floored to 0)
                  example: 120
      responses:
        "200":
          description: Round recorded, updated player returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - player
                    properties:
                      player:
                        $ref: "#/components/schemas/WasteSortPlayer"
        "400":
          description: Score missing or not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_BODY
                message: score must be a number
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions or game not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: GAME_NOT_ACTIVE
                message: Game is not active
        "429":
          description: Daily play limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DAILY_LIMIT_REACHED
                message: Already played 3 times today
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
