        "200":
          description: Registration point data
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RegistrationPointResponse"
        "400":
          description: Missing query parameter studentId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: MISSING_QUERY_PARAM
                message: "Missing required query parameter: studentId"
        "404":
          description: User or group registration point not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: User not found
                regNotFound:
                  value:
                    code: REGISTRATION_POINT_NOT_FOUND
                    message: Registration point not found for user's group
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
