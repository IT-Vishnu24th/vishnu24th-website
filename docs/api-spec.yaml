        - sessionCookie: []
      responses:
        "200":
          description: Submissions history list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserAnswerHistoryItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Internal server error
    post:
      tags:
        - Users
      operationId: submitMissionAnswer
      summary: Submit an answer for a mission question
      description: Participant only. Validates question type and checks if question submission window is currently open (matches active mission phase). User must not have already submitted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - answer
              properties:
                id:
                  type: string
                  example: q1
                answer:
                  oneOf:
                    - type: string
                      example: option1
                    - type: array
                      items:
                        type: string
                      example: [option1, option2]
      responses:
        "200":
          description: Answer submitted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: Answer submitted successfully
        "400":
          description: Request body validation failed or invalid question ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value:
                    code: INVALID_BODY
                    message: Invalid body
                invalidQuestion:
                  value:
                    code: INVALID_QUESTION_ID
                    message: Invalid question ID
                typeMismatch:
                  value:
                    code: INVALID_ANSWER_FORMAT
                    message: Answer must be an array of strings for multi-choice questions
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Submission window is closed or insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                submissionClosed:
                  value:
                    code: SUBMISSION_CLOSED
                    message: The submission window for this question is currently closed
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Forbidden
        "404":
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: USER_NOT_FOUND
                message: User profile not found
        "409":
          description: Answer already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: ANSWER_ALREADY_SUBMITTED
                message: You have already submitted an answer for this question
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal:
                  value:
                    code: INTERNAL_ERROR
                    message: Internal server error
                missingPhase:
                  value:
