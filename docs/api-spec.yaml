  /api/phase:
    get:
      tags:
        - Phase
      operationId: getPhases
      summary: Get current event and mission phases
      description: Returns the active registration phase and Vishnu mission phase. No authentication required.
      responses:
        "200":
          description: Current phases
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - regis
                      - vishnuMission
                    properties:
                      regis:
                        type: string
                        enum: [firstdate, vishnu-1, vishnu-2, vishnu-3, vishnu-4]
                        example: vishnu-1
                      vishnuMission:
                        type: string
                        enum:
                          [
                            mission-1,
                            mission-2,
                            mission-3,
                            mission-4,
                            mission-5,
                            mission-6,
                            mission-7,
                          ]
                        example: mission-1
        "500":
          description: Failed to fetch phases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Failed to fetch phases
    patch:
      tags:
        - Phase
      operationId: updatePhases
      summary: Update event phases
      description: Admin only. Updates the registration phase, mission phase, or both.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                regis:
                  type: string
                  enum: [firstdate, vishnu-1, vishnu-2, vishnu-3, vishnu-4]
                  example: vishnu-2
                vishnuMission:
                  type: string
                  enum:
                    [mission-1, mission-2, mission-3, mission-4, mission-5, mission-6, mission-7]
                  example: mission-2
      responses:
        "200":
          description: Phases updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - message
                      - regis
                      - vishnuMission
                    properties:
                      message:
                        type: string
                        example: Phase updated successfully
                      regis:
                        type: string
                        example: vishnu-2
                      vishnuMission:
                        type: string
                        example: mission-2
        "400":
          description: Invalid body or no phases provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noPhase:
                  value:
                    code: MISSING_PHASE
                    message: No phase provided
                invalidBody:
                  value:
                    code: INVALID_BODY
                    message: Invalid body
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: Not logged in
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: Forbidden
        "500":
          description: Failed to update phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: Failed to update phase
