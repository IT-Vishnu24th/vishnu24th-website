        height: 100%;

        height: 100%;

        display: block;
      }

      g.poi {
        transform-origin: center;
        transform-box: fill-box;
        filter: drop-shadow(0 0 3px #7b2c2c);
        transition: 200ms;
        & > path {
          transform-origin: center;
          transform-box: fill-box;
          transition: 200ms;
        }
        &:hover {
          filter: drop-shadow(0 0 5px #a00000);
          scale: 1.05;

            scale: 1.1;
          }
        }
      }
